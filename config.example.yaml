# Copy to the target repository as ACCEPTANCE.yaml and edit the commands.
chief_mode: codex # codex = autonomous local Chief; external = wait for ChatGPT verdict
max_iterations: 6
# Optional; omit for an unlimited total token budget.
# max_total_tokens: 300000
timeout_seconds: 1800

commands:
  - pnpm -r typecheck
  - pnpm -r test
uat_commands:
  - pnpm test

forbidden_paths:
  - real_data/
  - "*.xlsx"
  - "*.xls"
required_clean_patterns:
  - __pycache__/
# Optional tracked artifacts a gate is explicitly allowed to generate.
gate_allowed_paths: []
max_diff_bytes: 1000000
max_changed_paths: 1000

chief:
  agent: codex
  model: gpt-5.6-sol
  reasoning_effort: high
worker:
  agent: codex
  model: gpt-5.6-terra

# Optional external-Chief transport through an already attached Playwright
# Extension session. Keep the token in a private environment file.
gui_bridge:
  enabled: false
  conversation_url: https://chatgpt.com/c/REPLACE_WITH_FIXED_CHIEF_CONVERSATION
  session: chrome
  extension_env_file: ~/.config/playwright-mcp/env
  timeout_ms: 180000
