# Economical V3 autonomous single-task loop.
# Codex is the independent Chief for SELECT/REVIEW. The GUI bridge below is
# only needed when switching chief_mode to external.
chief_mode: codex
max_iterations: 8
timeout_seconds: 1800

chief:
  agent: codex
  model: gpt-5.6-sol
  reasoning_effort: high

worker:
  agent: codex
  mode: native_goal
  model: gpt-5.6-luna

# Only required when chief_mode: external:
# gui_bridge:
#   enabled: true
#   conversation_url: https://chatgpt.com/c/REPLACE_WITH_FIXED_CONVERSATION_ID
#   session: playwright-cli
#   extension_env_file: ~/.config/playwright-mcp/env
#   timeout_ms: 180000

# No max_total_tokens: omitted means no Ralph token-budget cap.
# Keep the existing commands, protected_paths, forbidden_paths, and
# gate_allowed_paths for the target repository.
