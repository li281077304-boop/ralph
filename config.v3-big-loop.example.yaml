# Economical V3 autonomous single-task loop.
# External Chief is the primary decision route; Host Sol is a fallback.
chief_mode: external
max_iterations: 8
timeout_seconds: 1800

chief:
  agent: codex
  model: gpt-5.6-sol
  reasoning_effort: high

worker:
  agent: codex
  # finite, bounded worker invocation; native_goal is legacy compatibility
  mode: stage
  model: gpt-5.6-luna

# Required for the primary external route. Omit only in tests or when an
# external transport is injected; the V3 router then falls back to Host Sol.
gui_bridge:
  enabled: true
  # Optional: an existing resolved conversation is reused when available;
  # omit this to let the bridge acquire a ChatGPT tab autonomously.
  session: playwright-cli
  extension_env_file: ~/.config/playwright-mcp/env
  timeout_ms: 180000

# No max_total_tokens: omitted means no Ralph token-budget cap.
# Keep the existing commands, protected_paths, forbidden_paths, and
# gate_allowed_paths for the target repository.
